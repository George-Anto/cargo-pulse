server:
  port: ${CARGOPULSE_SERVER_PORT:8080}

spring:
  datasource:
    url: ${CARGOPULSE_DB_URL:jdbc:postgresql://prod-db-host:5432/cargopulse}
    username: ${CARGOPULSE_DB_USER:prod_user}
    password: ${CARGOPULSE_DB_PASSWORD:prod_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${CARGOPULSE_REDIS_HOST_URL:${redis.prod.host}}
      port: ${CARGOPULSE_REDIS_PORT:6380}
      password: ${CARGOPULSE_REDIS_PASSWORD:${redis.prod.secret}}
      ssl:
        enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml

jwt:
  secret: ${CARGOPULSE_JWT_SECRET:${jwt.prod.secret}}
  expiration-ms: 900_000 # 15 minutes
  refresh-expiration-ms: 604_800_000 # 7 days (7 * 24 * 60 * 60 * 1000)

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never

host:
  url:
    frontend: ${CARGOPULSE_FRONTEND_URL:https://cargo-pulse.com}
    mobile-app: ${CARGOPULSE_MOBILE_APP_URL:app://cargopulse.mobile}

security:
  mobile-secret-header-key: ${CARGOPULSE_MOBILE_SECURITY_KEY_HEADER:${mobile.prod.secret.header.key}}
  mobile-secret-header-value: ${CARGOPULSE_MOBILE_SECURITY_KEY_VALUE:${mobile.prod.secret.header.value}}
  cookie:
    ssl-transfer: true

swagger:
  path: /swagger-ui/index.html
  requests:
    enabled: false # Must be 'true' or 'false'

monitoring:
  prometheus:
    ip-expression: ${CARGOPULSE_PROMETHEUS_IP:hasIpAddress('127.0.0.1')}
    port: ${CARGOPULSE_PROMETHEUS_PORT:9090}
  grafana:
    port: ${CARGOPULSE_GRAFANA_PORT:3000}