server:
  port: ${CARGOPULSE_SERVER_PORT:8080}

spring:
  datasource:
    url: ${CARGOPULSE_DB_URL:jdbc:postgresql://localhost:5432/cargopulse}
    username: ${CARGOPULSE_DB_USER:postgres}
    password: ${CARGOPULSE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${CARGOPULSE_REDIS_HOST_URL:${redis.dev.host}}
      port: ${CARGOPULSE_REDIS_PORT:${redis.dev.port}}
      password: ${CARGOPULSE_REDIS_PASSWORD:${redis.dev.secret}}
      ssl:
        enabled: true # Disable ssl for local redis

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml

jwt:
  secret: ${CARGOPULSE_JWT_SECRET:${jwt.dev.secret}}
  expiration-ms: 900000 # 15 minutes
  refresh-expiration-ms: 604800000 # 7 days (7 * 24 * 60 * 60 * 1000)

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

host:
  url:
    frontend: ${CARGOPULSE_FRONTEND_URL:https://cargo-pulse.com}
    mobile-app: ${CARGOPULSE_MOBILE_APP_URL:app://cargopulse.mobile}
    frontend-local: ${CARGOPULSE_LOCAL_FRONTEND_URL:http://localhost:4200}

security:
  cookie:
    transfer: false
  prometheus:
    ip-expression: ${CARGO_PULSE_PROMETHEUS_IP:hasIpAddress('127.0.0.1')}