server:
  port: ${CARGOPULSE_SERVER_PORT:8080}

spring:
  datasource:
    url: ${CARGOPULSE_DB_URL:jdbc:postgresql://localhost:5432/cargopulse}
    username: ${CARGOPULSE_DB_USER:postgres}
    password: ${CARGOPULSE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
