server:
  port: ${CARGOPULSE_SERVER_PORT:8443}
  ssl:
    # --------------------------------------------------------------------------------------
    # Self-Signed Certificate Generation
    # --------------------------------------------------------------------------------------
    # The certificate file below was generated using the Java keytool utility:
    # keytool -genkeypair -alias cargopulse -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore certificates/keystore.p12 -validity 3650
    # --------------------------------------------------------------------------------------
    # Current value: classpath:certificates/keystore.p12
    key-store: ${ssl.dev.key-store}
    # Current value: PKCS12
    key-store-type: ${ssl.dev.key-store-type}
    # Password for the keystore container (is required to open the keystore.p12 file)
    # Current value: mysecret
    key-store-password: ${CARGOPULSE_KEYSTORE_PASSWORD:${ssl.dev.key-store-password}}
    # Current value: cargopulse
    key-alias: ${ssl.dev.key-alias}
    # This password is required to access the actual certificate and private key,
    # allowing the server to decrypt traffic.
    # Current value: mysecret
    key-password: ${CARGOPULSE_KEY_PASSWORD:${ssl.dev.key-password}}

spring:
  datasource:
    url: ${CARGOPULSE_DB_URL:jdbc:postgresql://localhost:5432/cargopulse}
    username: ${CARGOPULSE_DB_USER:postgres}
    password: ${CARGOPULSE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${CARGOPULSE_REDIS_HOST_URL:${redis.dev.host}}
      # Use port 6379 with local container set up
      port: ${CARGOPULSE_REDIS_PORT:6380}
      password: ${CARGOPULSE_REDIS_PASSWORD:${redis.dev.secret}}
      ssl:
        enabled: true # Disable ssl for local redis

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml

jwt:
  secret: ${CARGOPULSE_JWT_SECRET:${jwt.dev.secret}}
  expiration-ms: 900_000 # 15 minutes
  refresh-expiration-ms: 604_800_000 # 7 days (7 * 24 * 60 * 60 * 1000)

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

host:
  url:
    frontend: ${CARGOPULSE_FRONTEND_URL:http://localhost:4200}
    mobile-app: ${CARGOPULSE_MOBILE_APP_URL:app://cargopulse.mobile}

security:
  mobile-secret-header-key: ${CARGOPULSE_MOBILE_SECURITY_KEY_HEADER:${mobile.dev.secret.header.key}}
  mobile-secret-header-value: ${CARGOPULSE_MOBILE_SECURITY_KEY_VALUE:${mobile.dev.secret.header.value}}
  cookie:
    ssl-transfer: false

swagger:
  path: /swagger-ui/index.html
  requests:
    enabled: true # Must be 'true' or 'false'

monitoring:
  prometheus:
    ip-expression: ${CARGOPULSE_PROMETHEUS_IP:hasIpAddress('127.0.0.1')}
    port: ${CARGOPULSE_PROMETHEUS_PORT:9090}
  grafana:
    port: ${CARGOPULSE_GRAFANA_PORT:3000}

azure:
  keyvault:
    uri: ${AZURE_KEY_VAULT_URI}
