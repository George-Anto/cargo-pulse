server:
  port: ${CARGOPULSE_SERVER_PORT:8443}
  ssl:
    # --------------------------------------------------------------------------------------
    # Self-Signed Certificate Generation
    # --------------------------------------------------------------------------------------
    # The certificate file below was generated using the Java keytool utility:
    # keytool -genkeypair -alias cargopulse -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore certificates/keystore.p12 -validity 3650
    # --------------------------------------------------------------------------------------
    # Current value: classpath:certificates/keystore.p12
    key-store: ${ssl.dev.key-store}
    # Current value: PKCS12
    key-store-type: ${ssl.dev.key-store-type}
    # Password for the keystore container (is required to open the keystore.p12 file)
    # Current value: mysecret
    key-store-password: ${cargo-pulse-keystore-password:${ssl.dev.key-store-password}}
    # Current value: cargopulse
    key-alias: ${ssl.dev.key-alias}
    # This password is required to access the actual certificate and private key,
    # allowing the server to decrypt traffic.
    # Current value: mysecret
    key-password: ${cargo-pulse-key-password:${ssl.dev.key-password}}

spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources[0]:
            endpoint: ${AZURE_KEYVAULT_ENDPOINT}

  datasource:
    url: ${cargo-pulse-db-url:jdbc:postgresql://localhost:5432/cargopulse}
    username: ${cargo-pulse-db-username:postgres}
    password: ${cargo-pulse-db-password:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      # Use "cargo-pulse-redis-host-local" secret for the local redis set up
      host: ${cargo-pulse-redis-host-azure:${redis.dev.host}}
      # Use port 6379 with local container set up
      port: ${CARGOPULSE_REDIS_PORT:6380}
      # Use "cargo-pulse-redis-password-local" secret for the local redis set up
      password: ${cargo-pulse-redis-password-azure:${redis.dev.secret}}
      ssl:
        enabled: false # Disable ssl for local redis

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml

jwt:
  secret: ${cargo-pulse-jwt-secret:${jwt.dev.secret}}
  expiration-ms: 900_000 # 15 minutes
  refresh-expiration-ms: 604_800_000 # 7 days (7 * 24 * 60 * 60 * 1000)

management:
  server:
    port: 8081
    # Set this property to ensure the management port uses HTTP,
    # NOT the main application's SSL/security configuration.
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

host:
  url:
    frontend: ${cargo-pulse-frontend-url:http://localhost:4200}
    mobile-app: ${cargo-pulse-mobile-app-url:app://cargopulse.mobile}

security:
  mobile-secret-header-key: ${CARGOPULSE_MOBILE_SECURITY_KEY_HEADER:${mobile.dev.secret.header.key}}
  mobile-secret-header-value: ${cargo-pulse-mobile-secret-value:${mobile.dev.secret.header.value}}
  cookie:
    ssl-transfer: true

swagger:
  path: /swagger-ui/index.html
  requests:
    enabled: true # Must be 'true' or 'false'

monitoring:
  prometheus:
    ip-expression: ${CARGOPULSE_PROMETHEUS_IP:hasIpAddress('127.0.0.1')}
    port: ${CARGOPULSE_PROMETHEUS_PORT:9090}
  grafana:
    port: ${CARGOPULSE_GRAFANA_PORT:3000}
