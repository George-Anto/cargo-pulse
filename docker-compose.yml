version: '3.8'

# Run the containers with: docker-compose up -d
services:
  # 1. REDIS SERVICE
  redis:
    image: redis:7.2-alpine
    container_name: cargo_pulse_redis
    restart: always
    ports:
      - "6379:6379"
    # Use environment variable substitution for password
    command: redis-server --appendonly yes --requirepass ${CARGOPULSE_REDIS_PASSWORD:-test_pass}
    volumes:
      - redis_data:/data

  # 2. PROMETHEUS MONITORING SERVICE
  # Prometheus is the primary monitoring system. It uses a 'pull' model to scrape (collect)
  # time-series metrics (like CPU, memory, HTTP request counts) from the application and stores them.
  prometheus:
    image: prom/prometheus:latest
    container_name: cargo_pulse_prometheus
    ports:
      - "9090:9090"
    volumes:
      # Mount the custom configuration file
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      # Define the scrape target environment variable here
      - APP_HOST_PORT=${CARGOPULSE_SCRAPE_TARGET:-host.docker.internal:8080}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # 3. GRAFANA VISUALIZATION SERVICE
  # Grafana is the visualization layer. It queries the metrics stored in Prometheus
  # and displays them in user-friendly dashboards.
  #
  #    Setup Notes for JVM Micrometer Dashboard (After running 'docker-compose up -d'):
  # 1. Access Grafana at http://localhost:3000 and login
  # 2. Add Prometheus Data Source:
  #    - Configuration (gear icon) -> Data Sources -> Add Prometheus.
  #    - HTTP URL: http://prometheus:9090 (Use the Docker service name, NOT localhost).
  #    - Click "Save & Test".
  # 3. Import JVM Micrometer Dashboard (ID 12900):
  #    - Dashboards -> Import -> Enter ID 12900.
  #    - Select the Prometheus data source created in step 2.
  #
  grafana:
    image: grafana/grafana:latest
    container_name: cargo_pulse_grafana
    ports:
      - "3000:3000"
    environment:
      # Use default values if environment variables are not set
      - GF_SECURITY_ADMIN_USER=${CARGOPULSE_GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${CARGOPULSE_GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

# Docker Volumes for persistent data
volumes:
  redis_data:
  prometheus_data:
  grafana_data: